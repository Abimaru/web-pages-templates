name: Desplegar catálogo a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Instalar dependencias (todas las apps)
        run: |
          for d in videojuegos-pixelvault computacion-nexora muebles-atelier-ibarguen ropa-maru farmacia-vitalis finanzas-prospera crm-nucleo movilidad-vianova nexo-lab; do
            echo "▶ npm ci — $d"
            ( cd "$d" && npm ci --no-audit --no-fund )
          done

      - name: Validar (lint + test)
        run: npm run check:all

      - name: Construir todas las apps
        # run-all.mjs aplica VITE_BASE / NEXT_PUBLIC_BASE_PATH por proyecto.
        run: npm run build:all

      - name: Smoke estático (salidas + sitemap)
        run: npm run smoke

      - name: Ensamblar sitio
        run: |
          mkdir -p _site
          cp -r catalogo/. _site/
          mkdir -p _site/pixelvault _site/nexora _site/muebles _site/maru _site/vitalis _site/prospera _site/nucleo _site/vianova _site/nexo-lab
          cp -r videojuegos-pixelvault/out/. _site/pixelvault/
          cp -r computacion-nexora/out/. _site/nexora/
          cp -r muebles-atelier-ibarguen/dist/. _site/muebles/
          cp -r ropa-maru/dist/. _site/maru/
          cp -r farmacia-vitalis/dist/. _site/vitalis/
          cp -r finanzas-prospera/dist/. _site/prospera/
          cp -r crm-nucleo/dist/. _site/nucleo/
          cp -r movilidad-vianova/dist/. _site/vianova/
          cp -r nexo-lab/dist/. _site/nexo-lab/
          touch _site/.nojekyll

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
