<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="glowO" cx="16%" cy="12%" r="60%">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e3ff"/><stop offset="1" stop-color="#ff2e97"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c07a86"/><stop offset="1" stop-color="#b8935f"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0b12"/>
  <rect width="1200" height="630" fill="url(#glowO)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Marca -->
  <rect x="80" y="66" width="62" height="62" rx="15" fill="url(#mark)"/>
  <text x="111" y="110" font-size="38" font-weight="bold" fill="#0a0b12" text-anchor="middle">A</text>
  <text x="162" y="98" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="1">Estudio Abimaru</text>
  <text x="163" y="122" font-size="14" fill="#ff9d4d" letter-spacing="3">DISEÑO &amp; DESARROLLO WEB</text>

  <!-- Título -->
  <text x="78" y="285" font-size="82" font-weight="bold" fill="#ffffff">Páginas web que</text>
  <text x="78" y="380" font-size="82" font-weight="bold" fill="#ff8a2a">venden.</text>

  <!-- Subtítulo -->
  <text x="80" y="440" font-size="27" fill="#c7ccdb">Catálogos web · Landing pages · Tiendas online</text>

  <!-- Indicadores -->
  <g font-size="19" fill="#e7e9f2">
    <rect x="80" y="512" width="176" height="46" rx="23" fill="#ffffff12" stroke="#ffffff22"/>
    <text x="168" y="541" text-anchor="middle">7 modelos listos</text>
    <rect x="268" y="512" width="196" height="46" rx="23" fill="#ffffff12" stroke="#ffffff22"/>
    <text x="366" y="541" text-anchor="middle">Diseño responsivo</text>
    <rect x="476" y="512" width="232" height="46" rx="23" fill="#ffffff12" stroke="#ffffff22"/>
    <text x="592" y="541" text-anchor="middle">Publicación incluida</text>
  </g>

  <!-- Mini previews de modelos -->
  <g>
    <!-- Card 1 -->
    <g transform="translate(770,74)">
      <rect width="360" height="150" rx="16" fill="#12142a" stroke="#ffffff20"/>
      <circle cx="20" cy="20" r="4" fill="#ff5f57"/><circle cx="34" cy="20" r="4" fill="#febc2e"/><circle cx="48" cy="20" r="4" fill="#28c840"/>
      <rect x="14" y="36" width="332" height="100" rx="10" fill="url(#c1)"/>
      <text x="180" y="94" font-size="26" font-weight="bold" fill="#0a0b12" text-anchor="middle">PIXELVAULT</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(770,240)">
      <rect width="360" height="150" rx="16" fill="#12142a" stroke="#ffffff20"/>
      <circle cx="20" cy="20" r="4" fill="#ff5f57"/><circle cx="34" cy="20" r="4" fill="#febc2e"/><circle cx="48" cy="20" r="4" fill="#28c840"/>
      <rect x="14" y="36" width="332" height="100" rx="10" fill="url(#c2)"/>
      <text x="180" y="94" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">NEXORA</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(770,406)">
      <rect width="360" height="150" rx="16" fill="#12142a" stroke="#ffffff20"/>
      <circle cx="20" cy="20" r="4" fill="#ff5f57"/><circle cx="34" cy="20" r="4" fill="#febc2e"/><circle cx="48" cy="20" r="4" fill="#28c840"/>
      <rect x="14" y="36" width="332" height="100" rx="10" fill="url(#c3)"/>
      <text x="180" y="94" font-size="26" font-weight="bold" fill="#3a2418" text-anchor="middle">MARÚ · moda</text>
    </g>
  </g>
</svg>
