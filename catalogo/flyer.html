<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flyer · Estudio Abimaru</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta property="og:title" content="Estudio Abimaru — Páginas web que venden" />
  <meta property="og:image" content="https://abimaru.github.io/web-pages-templates/assets/og-estudio-abimaru.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #05060b; color: #eef1f8; font-family: "Inter", system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
    .display { font-family: "Space Grotesk", sans-serif; }
    h1 { font-family: "Space Grotesk"; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    p.sub { color: #9aa2b8; font-size: 14px; margin-bottom: 20px; text-align: center; }
    .flyer-img { width: 100%; max-width: 520px; border-radius: 18px; box-shadow: 0 24px 60px #000a; border: 1px solid #ffffff14; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 12px; font-family: "Space Grotesk"; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: transform .2s, filter .2s; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn-orange { background: linear-gradient(100deg, #ff7a1a, #ff9d4d); color: #1a0e00; }
    .btn-wa { background: #25d366; color: #06310f; }
    .btn-ghost { background: #ffffff0d; color: #eef1f8; border: 1px solid #ffffff22; }
    .foot { margin-top: 24px; color: #6b7185; font-size: 13px; text-align: center; }
    .foot a { color: #ff9d4d; }
    @media print { body { background: #fff; padding: 0; } h1, p.sub, .actions, .foot { display: none; } .flyer-img { box-shadow: none; border: none; border-radius: 0; max-width: 100%; } }
  </style>
</head>
<body>
  <h1>Estudio Abimaru</h1>
  <p class="sub">Flyer promocional · Escanea el QR o toca “Ver modelos”.</p>

  <img class="flyer-img" src="assets/flyer-abimaru.jpg" alt="Flyer de Estudio Abimaru: Páginas web que venden. Catálogos, landing pages y tiendas online. Portafolio abimaru.github.io/web-pages-templates y WhatsApp 315 707 6691." />

  <div class="actions">
    <a class="btn btn-orange" href="./" target="_blank" rel="noopener noreferrer">Ver modelos ↗</a>
    <a class="btn btn-wa" href="https://wa.me/573157076691?text=Hola%2C%20vi%20el%20flyer%20de%20Estudio%20Abimaru.%20Quisiera%20una%20cotizaci%C3%B3n." target="_blank" rel="noopener noreferrer">Hablar por WhatsApp</a>
    <a class="btn btn-ghost" href="assets/flyer-abimaru.jpg" download="flyer-estudio-abimaru.jpg">Descargar imagen</a>
  </div>

  <p class="foot">
    abimaru.github.io/web-pages-templates · WhatsApp 315 707 6691<br />
    <a href="./">Volver al catálogo</a>
  </p>
</body>
</html>
